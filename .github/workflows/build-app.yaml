name: Build and Release PowerShell WinTool

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Package PowerShell WinTool
    runs-on: windows-2025

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Create runtime package
      shell: pwsh
      run: |
        $stagePath = Join-Path $PWD 'WinTool'
        New-Item -ItemType Directory -Path $stagePath -Force | Out-Null
        $excludedFiles = @(
          '.git',
          '.github',
          '.gitignore',
          'build',
          'BuildLocal.ps1',
          'elevate.manifest.xml',
          'Installer.ps1',
          'Invoke-MylesMattlockWinTool.ps1',
          'MM.ico',
          'README.md',
          'set-execution-policy.reg',
          'ToDo',
          'UpdatePolicy.ps1',
          'WinTool'
        )
        Get-ChildItem -LiteralPath $PWD -Force |
          Where-Object { $_.Name -notin $excludedFiles } |
          ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $stagePath -Recurse -Force
          }
        if (-not (Test-Path -LiteralPath (Join-Path $stagePath 'MylesMattlockWinTool.ps1'))) {
          throw 'The runtime package does not contain MylesMattlockWinTool.ps1.'
        }
        Compress-Archive -Path (Join-Path $stagePath '*') -DestinationPath (Join-Path $PWD 'WinTool.zip') -Force
        $releaseTag = if ($env:GITHUB_REF -eq 'refs/heads/dev') {
          'beta-latest'
        } elseif ($env:GITHUB_REF -eq 'refs/heads/main') {
          'prod-latest'
        } else {
          $env:GITHUB_REF_NAME
        }
        if ($releaseTag -notmatch '^[A-Za-z0-9._-]+$') {
          throw "Invalid release tag for launcher: $releaseTag"
        }
        $launcherPath = Join-Path $PWD 'Invoke-MylesMattlockWinTool.ps1'
        $launcherSource = [System.IO.File]::ReadAllText($launcherPath)
        $channelSetting = "`$env:MYLES_WINTOOL_RELEASE_TAG = '$releaseTag'`r`n"
        [System.IO.File]::WriteAllText(
          $launcherPath,
          $channelSetting + $launcherSource,
          [System.Text.UTF8Encoding]::new($false)
        )

    - name: Upload release assets
      uses: actions/upload-artifact@v7.0.1
      with:
        name: MylesMattlockWinTool-Release
        path: |
          WinTool.zip
          Invoke-MylesMattlockWinTool.ps1

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download release assets
      uses: actions/download-artifact@v8.0.1
      with:
        name: MylesMattlockWinTool-Release

    - name: Publish release assets
      uses: softprops/action-gh-release@v3.0.2
      with:
        tag_name: ${{ github.ref == 'refs/heads/dev' && 'beta-latest' || github.ref == 'refs/heads/main' && 'prod-latest' || github.ref_name }}
        files: |
          WinTool.zip
          Invoke-MylesMattlockWinTool.ps1
        draft: false
        prerelease: ${{ github.ref == 'refs/heads/dev' || contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
