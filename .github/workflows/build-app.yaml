name: Build and Package Windows Installer

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  windows_installer_build:
    name: Build Windows Installer
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Install ps2exe module
      run: |
        Install-Module -Name ps2exe -Force -Scope CurrentUser
      shell: pwsh

    - name: Prepare Staging and Build Executables
      run: |
        # 1. Create the package folder
        New-Item -ItemType Directory -Force -Path "ZipStage\windowsinstaller"
        
        # 2. Compile the main tool. Runtime dependencies must be beside the
        # executable because the script resolves them from its own directory.
        # WingetUserHelper.ps1 remains beside the executable because the tool
        # launches it with PowerShell when installing or removing applications.
        ps2exe -InputFile MylesMattlockWinTool.ps1 -OutputFile 'ZipStage\windowsinstaller\MylesMattlockWinTool.exe' -IconFile MM.ico -version '1.0.0'
        
        # 3. Copy runtime files beside the executable. This excludes build-only
        # files and the source entry point, while retaining helper scripts and
        # resource folders such as SystemCleanUp.
        Get-ChildItem -Exclude "ZipStage", ".git", ".github", ".gitignore", "elevate.manifest.xml", "InstallApplications.ps1", "Installer.ps1", "MylesMattlockWinTool.ps1", "set-execution-policy.reg", "ToDo", "UpdatePolicy.ps1", "README.md", "MM.ico" |
          Copy-Item -Destination "ZipStage\windowsinstaller" -Recurse -Force
      shell: pwsh

    - name: Embed Admin Manifests (mt.exe)
      run: |
        $mtPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\*\bin\*\x64\mt.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
        if (-not $mtPath) { throw "mt.exe not found" }
        
        # Apply the administrator manifest to the newly compiled tool.
        & $mtPath -manifest elevate.manifest.xml -outputresource:"ZipStage\windowsinstaller\MylesMattlockWinTool.exe";#1
        
        # If setup.exe also needs admin rights, uncomment the line below:
        # & $mtPath -manifest elevate.manifest.xml -outputresource:"ZipStage\windowsinstaller\setup.exe";#1
      shell: pwsh

    - name: Create Windows Installer ZIP
      run: |
        # We zip the contents of ZipStage so 'windowsinstaller' is the top-level folder
        Compress-Archive -Path "ZipStage\windowsinstaller" -DestinationPath "WindowsInstaller.zip"
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: WindowsInstaller-Package
        path: WindowsInstaller.zip

  create_release:
    name: Create Release
    needs: windows_installer_build
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: WindowsInstaller-Package

    - name: Create Release
      uses: softprops/action-gh-release@v3.0.2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'beta-latest' }}
        files: WindowsInstaller.zip
        draft: false
        prerelease: ${{ github.ref == 'refs/heads/main' || contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}